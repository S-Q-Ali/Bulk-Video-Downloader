[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsali-media-downloader"
version = "2.0.0"
description = "Bulk-download TikTok and YouTube videos with a queue-based desktop app."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "S-Q-Ali" }]
keywords = ["tiktok", "youtube", "downloader", "yt-dlp", "pyside6"]
dependencies = [
    "PySide6>=6.5",
    "yt-dlp>=2025.1.1",
    "curl_cffi==0.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pyinstaller>=6.10",
]

[project.urls]
Homepage = "https://github.com/S-Q-Ali/Bulk-Video-Downloader"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qsali_media_downloader = ["resources/*.ico"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
addopts = "-q"
